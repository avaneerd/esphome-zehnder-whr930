esphome:
  name: whr930

esp8266:
  board: d1_mini

external_components:
  - source: esphome/components

uart:
  id: uart_bus
  tx_pin: GPIO0
  rx_pin: GPIO1
  baud_rate: 9600

whr930:
  uart_id: uart_bus

fan:
- platform: whr930
  name: "Supply fan"
  type: "SUPPLY"
- platform: whr930
  name: "Exhaust fan"
  type: "EXHAUST"
- platform: whr930
  name: "fan"
  type: "BOTH"

number:
- platform: whr930
  comfort_temperature:
    name: "Comfort temperature"

sensor:
- platform: whr930
  t1_temperature:
    name: "Outside to WHR930 temperature"
  t2_temperature:
    name: "WHR930 to inside temperature"
  t3_temperature:
    name: "Inside to WHR930 temperature"
  t4_temperature:
    name: "WHR930 to outside temperature"
  bypass_position:
    name: "Bypass position"
  supply_fan_speed:
    name: "Supply fan speed"
  exhaust_fan_speed:
    name: "Exhaust fan speed"
  supply_fan_rpm:
    name: "Supply fan RPM"
  exhaust_fan_rpm:
    name: "Exhaust fan RPM"
  filter_hours:
    name: "Filter hours"

text_sensor:
- platform: whr930
  filter_status:
    name: "Filter status"
  error_a:
    name: "Error A"
  error_e:
    name: "Error E"
  error_ea:
    name: "Error EA"

select:
- platform: whr930
  ventilation_level:
    name: "Ventilation level"